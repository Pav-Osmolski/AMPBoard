name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without uploading or deleting files
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
      # Pushes preview until repository variable DEPLOY_ENABLED is set to true.
      # Manual runs use the dry_run checkbox independently of that variable.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name != 'workflow_dispatch' && vars.DEPLOY_ENABLED != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploys committed dist assets, matching the previous workflow.
      - name: Configure verified SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST}"
          : "${SSH_USERNAME:?Missing SSH_USERNAME}"
          : "${SSH_PORT:?Missing SSH_PORT}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"
          : "${REMOTE_PATH:?Missing REMOTE_PATH}"
          [[ "$SSH_HOST" == 'poseidon.hostns.io' ]]
          [[ "$SSH_USERNAME" == 'u101738' ]]
          [[ "$SSH_PORT" == '22' ]]
          expected='/home/u101738/domains/pawel-osmolski.com/public_html/private/ampboard'
          [[ "${REMOTE_PATH%/}" == "$expected" ]] || { echo 'Unexpected deployment path'; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/github_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/github_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  ConnectTimeout 20\n' \
            "$SSH_HOST" "$SSH_USERNAME" "$SSH_PORT" > ~/.ssh/config

      - name: Check remote destination
        shell: bash
        run: |
          set -euo pipefail
          ssh deploy 'set -eu; command -v rsync; cd /home/u101738/domains/pawel-osmolski.com/public_html/private/ampboard; test -w .; test "$(pwd -P)" = /home/u101738/domains/pawel-osmolski.com/public_html/private/ampboard'

      - name: Sync AMPBoard
        shell: bash
        run: |
          set -euo pipefail
          options=(-az --delete-delay --itemize-changes)
          if [[ "$DRY_RUN" == 'true' ]]; then
            echo 'Preview only: no files will be uploaded or deleted.'
            options+=(--dry-run)
          fi
          rsync "${options[@]}" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.idea/' \
            --exclude='/.gitignore' \
            --exclude='node_modules/' \
            --exclude='.key' \
            --exclude='/logs/' \
            --exclude='/dist/exports/' \
            --exclude='/.htaccess' \
            --exclude='/.htpasswd' \
            --exclude='/config/local.php' \
            --include='/config/' \
            --include='/config/profiles/' \
            --include='/config/profiles/default/***' \
            --exclude='/config/profiles/**' \
            ./ "deploy:${REMOTE_PATH%/}/"

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/github_deploy ~/.ssh/config ~/.ssh/known_hosts
